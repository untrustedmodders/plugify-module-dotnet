context:
  name: plugify-module-dotnet
  version: ${{ env.get("PACKAGE_VERSION") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: .
  use_gitignore: false

build:
  number: 0
  string: ${{ target_platform | replace("-", "_") }}
  dynamic_linking:
    missing_dso_allowlist:
      - if: linux
        then:
          - "*/ld-linux*.so.*"
          - "*/libc.so.*"
          - "*/libm.so.*"
          - "*/libdl.so.*"
          - "*/libpthread.so.*"
          - "*/librt.so.*"
          - "*/libplugify.so*"
          - "*/libhostfxr.so*"
      - if: osx
        then:
          - "/usr/lib/libc++.1.dylib"
          - "/usr/lib/libSystem.B.dylib"
          - "/usr/lib/libc++abi.dylib"
          - "/usr/lib/libutil.dylib"
          - "/System/Library/Frameworks/*"
          - "*/libplugify.dylib"
          - "*/libplugify.*.dylib"
          - "@rpath/libplugify.dylib"
          - "@loader_path/libplugify.dylib"
          - "*/libhostfxr.dylib"
          - "*/libhostfxr.*.dylib"
          - "@rpath/libhostfxr.dylib"
          - "@loader_path/libhostfxr.dylib"
      - if: win
        then:
          - "*/plugify.dll"
          - "*/hostfxr.dll"

requirements:
  run:
    - if: linux
      then: __glibc >=2.26
    - if: osx and arm64
      then: __osx >=11.0

about:
  homepage: https://github.com/${{ env.get("GITHUB_REPOSITORY", default="untrustedmodders/plugify-module-dotnet") }}
  license: MIT
  license_file: LICENSE
  summary: "Adds support for C# (.NET) plugins"
  description: |
    Adds support for C# (.NET) plugins
  documentation: https://github.com/${{ env.get("GITHUB_REPOSITORY", default="untrustedmodders/plugify-module-dotnet") }}/blob/main/README.md
  repository: https://github.com/${{ env.get("GITHUB_REPOSITORY", default="untrustedmodders/plugify-module-dotnet") }}

extra:
  recipe-maintainers:
    - ${{ env.get("GITHUB_ACTOR", default="untrustedmodders") }}
